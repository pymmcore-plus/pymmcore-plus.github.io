# Base configuration for the unified pymmcore-plus docs.
#
# tools/compose.py merges member contributions (mkdocstrings paths, griffe
# extensions, inventories) into this file and writes ./zensical.toml.
# Navigation lives in docs/**/.nav.yml (awesome-nav), not here.

[project]
site_name = "pymmcore-plus"
site_description = "Control microscopes with Python: Micro-Manager's core, acquisition engine, widgets, and apps."
site_url = "https://pymmcore-plus.github.io/"
repo_url = "https://github.com/pymmcore-plus/pymmcore-plus"
repo_name = "pymmcore-plus"
edit_uri = ""                     # per-page edit links come from front matter
copyright = "Copyright &copy; pymmcore-plus contributors"
docs_dir = "build/docs"
site_dir = "site"
extra_css = ["assets/css/pymm.css"]
extra_javascript = ["assets/js/pymm.js"]

[project.theme]
custom_dir = "overrides"
variant = "modern"
icon.logo = "lucide/microscope"
favicon = "assets/img/favicon.ico"
features = [
  "announce.dismiss",
  "content.action.copy",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/pymmcore-plus"
name = "pymmcore-plus on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/discourse"
link = "https://forum.image.sc/tag/pymmcore-plus"
name = "image.sc forum"

[[project.extra.social]]
icon = "simple/zulip"
link = "https://imagesc.zulipchat.com/#narrow/channel/442785-pymmcore.5B-plus.5D"
name = "Zulip chat"

# ---------------------------------------------------------------------------
# Markdown
# ---------------------------------------------------------------------------

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions."pymdownx.betterem"]
[project.markdown_extensions."pymdownx.caret"]
[project.markdown_extensions."pymdownx.details"]
[project.markdown_extensions."pymdownx.emoji"]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions."pymdownx.inlinehilite"]
[project.markdown_extensions."pymdownx.keys"]
[project.markdown_extensions."pymdownx.magiclink"]
[project.markdown_extensions."pymdownx.mark"]
[project.markdown_extensions."pymdownx.smartsymbols"]
[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [{ name = "mermaid", class = "mermaid" }]
[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions."pymdownx.tasklist"]
custom_checkbox = true
[project.markdown_extensions."pymdownx.tilde"]
[project.markdown_extensions."zensical.extensions.preview"]
[project.markdown_extensions.pymm_mdx]   # tools/pymm_mdx.py

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------

[project.plugins.search]

[project.plugins.awesome-nav]

[project.plugins.autorefs]
resolve_closest = true

[project.plugins.glightbox]
# light/dark screenshot pairs (`#only-light` / `#only-dark`) form separate galleries
auto_themed = true

[project.plugins.mkdocs-video]
is_video = true
video_muted = true
video_controls = false
video_autoplay = true
video_loop = true

[project.plugins.llmstxt]
markdown_description = "Python tools for controlling microscopes with Micro-Manager: pymmcore-plus (core + acquisition engine), useq-schema (experiment schema), pymmcore-widgets (Qt widgets), pymmcore-gui and napari-micromanager (applications)."
full_output = "llms-full.txt"

[project.plugins.llmstxt.sections]
"Getting started" = ["getting-started/*.md"]
"User guide" = ["*/guides/*.md", "useq-schema/schema/*.md"]
"API reference" = ["*/api/**/*.md"]

[project.plugins.redirects.redirect_maps]
# filled in by tools/compose.py from redirects.toml

[project.plugins.mkdocstrings]
enable_inventory = true

[project.plugins.mkdocstrings.handlers.python]
paths = []
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://numpy.org/doc/stable/objects.inv",
  "https://psygnal.readthedocs.io/en/latest/objects.inv",
  "https://pyapp-kit.github.io/superqt/objects.inv",
  "https://docs.pydantic.dev/latest/objects.inv",
  "https://pymmcore-plus.github.io/ome-writers/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
allow_inspection = false
backlinks = "tree"
docstring_section_style = "table"
docstring_style = "numpy"
filters = ["!^_"]
heading_level = 2
inherited_members = false
line_length = 80
members_order = "source"
merge_init_into_class = true
modernize_annotations = true
separate_signature = true
show_bases = true
show_if_no_docstring = true
show_root_heading = true
show_signature_annotations = true
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
signature_crossrefs = true
summary = true
extensions = [{ griffe_fieldz = { include_inherited = true, strip_annotated = true } }]
preload_modules = []
