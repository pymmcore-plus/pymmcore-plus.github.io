# Build and deploy https://pymmcore-plus.github.io from the main branch of every member.
#
# Triggered by pushes here, by members after they merge to main
# (`gh workflow run deploy.yml -R pymmcore-plus/pymmcore-plus.github.io`), and nightly.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source:
        description: "What triggered this deploy (e.g. owner/repo@sha)"
        required: false
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv run --no-project tools/repos.py
      - run: uv sync
      - uses: pymmcore-plus/setup-mm-test-adapters@main

      - name: Build
        shell: bash # -o pipefail, so a failed build isn't hidden by `tee`
        # not --strict: a warning in one member must not block deploying the others
        run: |
          echo "Triggered by: ${{ inputs.source || github.event_name }}"
          uv run tools/compose.py build 2>&1 | tee build.log
          { echo '### Build warnings'; echo '```'; grep -iE 'warning|PROBLEM' build.log || echo none; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
