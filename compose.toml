# Members of the unified docs site.
#
# Each member is checked out at .repos/<name> (see tools/repos.py) and its
# docs/ folder is mounted at /<name>/ in the built site.  Members own their
# pages, their .nav.yml files, and a minimal zensical.toml (mkdocstrings paths,
# griffe extensions, api-autonav settings).

