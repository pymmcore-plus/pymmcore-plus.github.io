# Environment for building the unified pymmcore-plus ecosystem docs.
# Member repos are checked out (or worktree'd) into .repos/ by tools/repos.py.
[project]
name = "pymmcore-plus-docs"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "zensical ~=0.0.73",
    "mkdocstrings-python >=2.0.10",
    "griffelib >=2.4.1",
    "griffe-fieldz >=0.5",
    "pymdown-extensions >=10.16",
    "tomli-w >=1.2",
    "watchfiles >=1.1",
    # members (editable, from .repos/)
    "pymmcore-plus[cli]",
    "useq-schema",
    "pymmcore-widgets",
    "PyQt6 >=6.7",
]

[dependency-groups]
dev = ["ruff >=0.14", "prek >=0.3"]

[tool.uv]
package = false

[tool.uv.sources]
pymmcore-plus = { path = ".repos/pymmcore-plus", editable = true }
useq-schema = { path = ".repos/useq-schema", editable = true }
pymmcore-widgets = { path = ".repos/pymmcore-widgets", editable = true }

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "RUF", "TC"]
